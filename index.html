<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeonTrade Scanner</title><style>
body{margin:0;background:#09080d;color:#f7f3fa;font-family:system-ui;max-width:700px;margin:auto;padding:18px}.card{background:#15121c;border:1px solid #2d2636;border-radius:18px;padding:16px;margin:12px 0}.pink{color:#ff3c91}.green{color:#38e58a}.red{color:#ff587e}.muted{color:#9991a4;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#0d0b11;border:1px solid #2d2636;border-radius:12px;padding:10px}.signal{font-weight:900;padding:5px 9px;border-radius:999px;font-size:11px}.buy{background:#103c2b;color:#53f0a2}.sell{background:#42182a;color:#ff7e9e}.neutral{background:#302936;color:#ddd3e2}.bar{height:8px;background:#29232f;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2e88,#b82cff)}button{background:#ff2e88;color:white;border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.input{width:100%;padding:11px;box-sizing:border-box;background:#0d0b11;border:1px solid #3a3143;border-radius:10px;color:#fff;margin-top:5px}.hidden{display:none}</style></head><body>
<h1>NEON<span class="pink">TRADE</span></h1>
<div class="card"><div class="row"><div><div class="muted">AUTOMATED OPPORTUNITY SCANNER</div><h2 id="state">Connecting…</h2></div><button onclick="scan()">SCAN NOW</button></div><div class="muted">Live MT5 candles · M15 · refresh every 30 seconds</div><div id="last" class="muted"></div></div>
<div id="results"></div>
<script>
const API='http://localhost:8000';
function sigClass(s){return s==='BUY'?'buy':s==='SELL'?'sell':'neutral'}
function card(x){if(x.signal==='ERROR') return `<div class="card"><b>${x.requested_symbol}</b><div class="red">${x.error}</div></div>`;return `<div class="card"><div class="row"><div><h2>${x.symbol}</h2><div class="muted">${x.timeframe} · ${x.candles} live candles</div></div><span class="signal ${sigClass(x.signal)}">${x.signal}</span></div><div class="row"><div><div class="muted">CONFIDENCE</div><b style="font-size:30px">${x.confidence}%</b></div><div style="width:55%"><div class="bar"><i style="width:${x.confidence}%"></i></div></div></div><div class="grid"><div class="metric"><div class="muted">Entry</div><b>${x.entry}</b></div><div class="metric"><div class="muted">Stop</div><b>${x.stop_loss}</b></div><div class="metric"><div class="muted">Take profit</div><b>${x.take_profit}</b></div><div class="metric"><div class="muted">Spread</div><b>${x.spread}</b></div></div><div class="grid" style="margin-top:9px"><div class="metric"><div class="muted">EMA 20 / 50</div><b>${x.ema20} / ${x.ema50}</b></div><div class="metric"><div class="muted">RSI</div><b>${x.rsi}</b></div><div class="metric"><div class="muted">MACD</div><b>${x.macd}</b></div><div class="metric"><div class="muted">Support</div><b>${x.support}</b></div></div><div class="muted" style="margin-top:10px">Resistance ${x.resistance} · ATR ${x.atr}</div><div class="muted" style="margin-top:8px">${x.reasons.join(' · ')}</div></div>`}
async function scan(){document.getElementById('state').textContent='Scanning live markets…';try{const r=await fetch(API+'/api/opportunities');const d=await r.json();document.getElementById('results').innerHTML=d.results.map(card).join('');document.getElementById('state').textContent='Scanner active';document.getElementById('last').textContent='Last scan: '+new Date(d.scanned_at).toLocaleString()}catch(e){document.getElementById('state').textContent='Backend/MT5 unavailable';document.getElementById('results').innerHTML='<div class="card">Start the NeonTrade backend and connect MT5.</div>'}}
scan();setInterval(scan,30000);
</script></body></html>
